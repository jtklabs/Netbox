# NOTE: deviates from upstream netbox-docker — the postgres service lives in
# compose/dev.yml (prod uses RDS and must not run a local DB; overlays cannot
# remove services, so the base defines none). See VERSIONS.md.
services:
  netbox: &netbox
    image: docker.io/netboxcommunity/netbox:${VERSION-v4.6-5.0.2}
    depends_on:
      - redis
      - redis-cache
    env_file: env/netbox.env
    user: "netbox:root"
    healthcheck:
      test: curl -f http://localhost:8080/login/ || exit 1
      start_period: 90s
      timeout: 3s
      interval: 15s
    volumes:
      - ./configuration:/etc/netbox/config:z,ro
      - netbox-media-files:/opt/netbox/netbox/media:rw
      - netbox-reports-files:/opt/netbox/netbox/reports:rw
      - netbox-scripts-files:/opt/netbox/netbox/scripts:rw
      # Repo-managed custom scripts. Read-only on purpose: the repo is the
      # source of truth, and NetBox reads these through a local Data Source
      # (docs/SCHEDULED-JOBS.md) rather than by uploads that would live only
      # on this disposable node.
      - ./netbox-scripts:/opt/netbox/netbox/scripts-repo:z,ro
      # Drop zone for CSV files to import (lifecycle dates, prices, quotes)
      # and for scripts to write exports into. The directory is kept in the
      # repo (csv/.gitkeep) so Docker does not create it root-owned on first
      # start; the CSVs themselves are git-ignored — they carry pricing.
      - ./csv:/opt/netbox/netbox/csv:z,rw
  netbox-worker:
    <<: *netbox
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s

  # redis
  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    healthcheck: &redis-healthcheck
      test: '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    env_file: env/redis.env
    volumes:
      - netbox-redis-data:/data
  redis-cache:
    image: docker.io/valkey/valkey:9.1-alpine
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - valkey-server --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    healthcheck: *redis-healthcheck
    env_file: env/redis-cache.env
    volumes:
      - netbox-redis-cache-data:/data

volumes:
  netbox-media-files:
    driver: local
  netbox-redis-cache-data:
    driver: local
  netbox-redis-data:
    driver: local
  netbox-reports-files:
    driver: local
  netbox-scripts-files:
    driver: local
