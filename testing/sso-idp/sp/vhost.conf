# TLS is not optional decoration here: this mellon build stamps SameSite=None
# on its cookies no matter what MellonCookieSameSite says, and browsers refuse
# None-without-Secure — over plain http every REAL browser loses the cookie
# test and gets a bare 400 at /mellon/postResponse, while scripted clients
# (which ignore SameSite) pass. Prod is https, so the rig being https also
# matches the shape being rehearsed.
<VirtualHost *:443>
    ServerName TEST_HOST
    SSLEngine on
    SSLCertificateFile /etc/apache2/mellon/tls-cert.pem
    SSLCertificateKeyFile /etc/apache2/mellon/tls-key.pem
    LogLevel info auth_mellon:info
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    # Same shape as prod: the repo include sits INSIDE the existing vhost.
    Include conf-available/mellon-base.conf
    Include conf-available/netbox.conf
</VirtualHost>
