# SP-wide Mellon config. Prod already has all of this — the rig recreates it so
# apache/netbox.conf is exercised against a REAL mod_auth_mellon.
<Location />
    MellonEnable "info"
    MellonSPentityId "https://TEST_HOST:8082/mellon/metadata"
    MellonSPPrivateKeyFile /etc/apache2/mellon/sp-key.pem
    MellonSPCertFile /etc/apache2/mellon/sp-cert.pem
    MellonEndpointPath "/mellon"
    MellonIdPMetadataFile /etc/apache2/mellon/idp-metadata.xml
    # Secure is REQUIRED: mellon emits SameSite=None on its cookies (this build
    # ignores MellonCookieSameSite for them), and browsers drop None-without-
    # Secure. See vhost.conf for why the rig is https at all.
    MellonSecureCookie On
</Location>
