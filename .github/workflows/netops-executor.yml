name: NetOps Executor
on:
  pull_request:
    paths:
      - 'services/netops-executor/**'
      - '.github/workflows/netops-executor.yml'
  push:
    branches: [main]
    paths:
      - 'services/netops-executor/**'
      - '.github/workflows/netops-executor.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: services/netops-executor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y nmap
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: ruff check . && ruff format --check .
      - run: node --check netops_executor/static/app.js
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t netops-executor:test services/netops-executor
      - run: docker run --rm netops-executor:test netops-executor --help
      - run: docker run --rm --cap-drop ALL netops-executor:test nmap --version
