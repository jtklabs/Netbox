---
discovery_mode: poller
discovery_repo_root: "{{ playbook_dir }}/../../.."
discovery_install_dir: /opt/endpoint-discovery
discovery_service_dir: "{{ discovery_install_dir }}/services/endpoint-discovery"
discovery_database_url: ""
discovery_url: ""
discovery_poller_token: ""
discovery_snmp_credentials: {}
discovery_principals: []
discovery_targets: []
discovery_poll_seconds: 60
discovery_workers: 32
