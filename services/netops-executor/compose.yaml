# Preserve existing default named volumes across the directory rename.
name: ${NETOPS_COMPOSE_PROJECT:-f5-upgrade}
x-service: &service
  build: .
  image: netops-executor:local
  init: true
  restart: unless-stopped
  env_file: .env
  environment:
    NETOPS_DATA_DIR: /data
    NETOPS_BACKUP_ROOT: /backups
    NETOPS_IMAGE_ROOT: /images
    NETOPS_DEVICES_FILE: /config/devices.json
    NETOPS_KNOWN_HOSTS: /config/known_hosts
  volumes:
    - data:/data
    - backups:/backups
    - ./images:/images:z
    - ./config:/config:ro,z
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  api:
    <<: *service
    ports:
      - "${NETOPS_BIND_ADDRESS:-${F5_BIND_ADDRESS:-127.0.0.1}}:${NETOPS_PORT:-${F5_PORT:-8080}}:8080"
    command: ["netops-executor", "serve", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  # One service per worker pool. Each worker claims from its pool's queue first, then the other
  # pool's queue, then scheduled work.
  worker-priority:
    <<: *service
    command: ["netops-executor", "worker", "--pool", "priority"]
    stop_grace_period: 2h
    deploy:
      replicas: ${NETOPS_PRIORITY_WORKERS:-2}
  worker-upgrade:
    <<: *service
    command: ["netops-executor", "worker", "--pool", "upgrade"]
    stop_grace_period: 2h
    deploy:
      replicas: ${NETOPS_UPGRADE_WORKERS:-1}
volumes:
  data:
  backups:
