[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-executor"
version = "0.16.2"
description = "Multi-vendor SSH, HTTP and SNMP execution with durable F5, PAN-OS and Arista EOS upgrade workflows"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "paramiko>=3.5,<5", "python-dotenv>=1,<2", "httpx>=0.28,<1", "pysnmp>=7.1.30,<8", "cryptography>=44,<51", "netmiko==4.8.0", "passlib==1.7.4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
f5-upgrade = "netops_executor.cli:main"
netops-executor = "netops_executor.cli:main"

[tool.setuptools.package-data]
netops_executor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
include = ["netops_executor*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
