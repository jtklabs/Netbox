# NetOps Executor behind Apache httpd 2.4 at https://<server>/netops-executor/
#
# 1. Enable the modules: Debian/Ubuntu `a2enmod proxy proxy_http headers ssl`;
#    RHEL loads mod_proxy, mod_proxy_http, mod_headers and mod_ssl by default.
# 2. Set NETOPS_ROOT_PATH=/netops-executor in /etc/netops-executor/service.env and restart
#    netops-executor-api, so /docs and batch status_url values include the prefix.
# 3. Keep the API bound to 127.0.0.1:8080 (deploy/netops-executor-api.service) so Apache is
#    the only way in.
#
# To add it to an existing HTTPS site, copy only the RedirectMatch and <Location> block into
# that <VirtualHost *:443>.

<VirtualHost *:80>
    ServerName netops.example.com
    # Bearer tokens must never cross the network in clear text.
    Redirect permanent / https://netops.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName netops.example.com
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/netops.example.com.crt
    SSLCertificateKeyFile /etc/pki/tls/private/netops.example.com.key

    # The console uses relative links, so it needs the trailing slash.
    RedirectMatch 308 ^/netops-executor$ /netops-executor/

    <Location /netops-executor/>
        # Apache strips the prefix; the executor adds it back from NETOPS_ROOT_PATH.
        # Authorization and Idempotency-Key headers pass through unchanged.
        ProxyPass http://127.0.0.1:8080/ timeout=300 retry=0
        ProxyPassReverse http://127.0.0.1:8080/
        RequestHeader set X-Forwarded-Proto "https"
    </Location>
</VirtualHost>
