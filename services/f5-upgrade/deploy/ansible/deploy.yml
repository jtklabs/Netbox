---
- name: Deploy remote execution service
  hosts: execution_remotes
  become: true
  vars:
    executor_source: "{{ playbook_dir }}/../.."
    executor_workers: 2
    executor_devices: []
    executor_http_targets: []
    executor_credentials: {}
    executor_known_hosts: ""
    executor_python: "{{ 'python3.11' if ansible_facts.os_family == 'RedHat' else 'python3' }}"
  pre_tasks:
    - name: Validate supported OS and required secret
      ansible.builtin.assert:
        that:
          - (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version is version('24.04', '>=')) or (ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version == '9')
          - executor_api_token | default('') is match('^[A-Za-z0-9_.~-]{32,}$')
          - executor_workers | int > 0
      no_log: true
  tasks:
    - name: Install Python on Ubuntu
      ansible.builtin.apt:
        name: [python3, python3-venv, python3-pip]
        state: present
        update_cache: true
      when: ansible_facts.os_family == 'Debian'
    - name: Install Python on RHEL 9
      ansible.builtin.dnf:
        name: [python3.11, python3.11-pip]
        state: present
      when: ansible_facts.os_family == 'RedHat'
    - name: Create service account
      ansible.builtin.user:
        name: f5upgrade
        system: true
        create_home: false
        shell: /usr/sbin/nologin
    - name: Create private directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: f5upgrade
        group: f5upgrade
        mode: "0700"
      loop:
        [
          /opt/f5-upgrade,
          /etc/f5-upgrade,
          /var/lib/f5-upgrade,
          /var/backups/f5-upgrade,
          /srv/f5-images,
        ]
    - name: Inspect existing services
      ansible.builtin.service_facts:
    - name: Drain existing workers before updating their code
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ ansible_facts.services.keys() | select('match', '^f5-upgrade-worker@.*\\.service$') | list }}"
    - name: Stop existing API before updating its code
      ansible.builtin.systemd_service:
        name: f5-upgrade-api
        state: stopped
      when: "'f5-upgrade-api.service' in ansible_facts.services"
    - name: Copy application source and pinned dependencies
      ansible.builtin.copy:
        src: "{{ executor_source }}/{{ item }}"
        dest: /opt/f5-upgrade/
        owner: root
        group: f5upgrade
        mode: preserve
      loop: [f5_upgrade, pyproject.toml, requirements.lock]
    - name: Create virtual environment
      ansible.builtin.command:
        argv: ["{{ executor_python }}", -m, venv, /opt/f5-upgrade/.venv]
        creates: /opt/f5-upgrade/.venv/bin/python
    - name: Install pinned dependencies and application
      ansible.builtin.pip:
        requirements: /opt/f5-upgrade/requirements.lock
        virtualenv: /opt/f5-upgrade/.venv
    - name: Install application package
      ansible.builtin.pip:
        name: /opt/f5-upgrade
        extra_args: --no-deps --force-reinstall
        virtualenv: /opt/f5-upgrade/.venv
    - name: Generate credential encryption key once
      become_user: f5upgrade
      ansible.builtin.command:
        argv:
          [
            /opt/f5-upgrade/.venv/bin/f5-upgrade,
            init-key,
            /etc/f5-upgrade/credentials.key,
          ]
        creates: /etc/f5-upgrade/credentials.key
      no_log: true
    - name: Enforce encryption key ownership
      ansible.builtin.file:
        path: /etc/f5-upgrade/credentials.key
        owner: f5upgrade
        group: f5upgrade
        mode: "0600"
    - name: Configure service environment
      ansible.builtin.copy:
        dest: /etc/f5-upgrade/service.env
        owner: f5upgrade
        group: f5upgrade
        mode: "0600"
        content: |
          F5_API_TOKEN={{ executor_api_token }}
          F5_CREDENTIAL_KEY_FILE=/etc/f5-upgrade/credentials.key
          F5_DATA_DIR=/var/lib/f5-upgrade
          F5_BACKUP_ROOT=/var/backups/f5-upgrade
          F5_IMAGE_ROOT=/srv/f5-images
          F5_DEVICES_FILE=/etc/f5-upgrade/devices.json
          F5_HTTP_TARGETS_FILE=/etc/f5-upgrade/http-targets.json
          F5_KNOWN_HOSTS=/etc/f5-upgrade/known_hosts
      no_log: true
    - name: Configure inventories
      ansible.builtin.copy:
        dest: "/etc/f5-upgrade/{{ item.name }}"
        content: "{{ item.content }}"
        owner: f5upgrade
        group: f5upgrade
        mode: "0600"
      loop:
        - name: devices.json
          content: "{{ executor_devices | to_nice_json }}"
        - name: http-targets.json
          content: "{{ executor_http_targets | to_nice_json }}"
        - name: known_hosts
          content: "{{ executor_known_hosts }}"
    - name: Install service units
      ansible.builtin.copy:
        src: "{{ executor_source }}/deploy/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [f5-upgrade-api.service, "f5-upgrade-worker@.service"]
    - name: Start API on loopback
      ansible.builtin.systemd_service:
        name: f5-upgrade-api
        enabled: true
        state: started
        daemon_reload: true
    - name: Wait for local API
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/healthz
        status_code: 200
      register: health
      retries: 30
      delay: 2
      until: health.status == 200
    - name: Upsert encrypted credentials with stable IDs
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api/v1/credentials/{{ item.key }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ executor_api_token }}"
        body_format: json
        body: "{{ item.value }}"
        status_code: 200
      loop: "{{ executor_credentials | dict2items }}"
      no_log: true
    - name: Start workers
      ansible.builtin.systemd_service:
        name: "f5-upgrade-worker@{{ item }}"
        enabled: true
        state: started
      loop: "{{ range(1, executor_workers | int + 1) | list }}"
