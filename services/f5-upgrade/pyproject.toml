[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "f5-ssh-upgrade"
version = "0.2.0"
description = "SSH-based BIG-IP upgrade jobs with a local API and durable workers"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "paramiko>=3.5,<5", "python-dotenv>=1,<2", "httpx>=0.28,<1", "pysnmp>=7.1.30,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
f5-upgrade = "f5_upgrade.cli:main"

[tool.setuptools.package-data]
f5_upgrade = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
include = ["f5_upgrade*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
