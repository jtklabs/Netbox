x-service: &service
  build: .
  image: f5-ssh-upgrade:local
  init: true
  restart: unless-stopped
  env_file: .env
  environment:
    F5_DATA_DIR: /data
    F5_BACKUP_ROOT: /backups
    F5_IMAGE_ROOT: /images
    F5_DEVICES_FILE: /config/devices.json
    F5_KNOWN_HOSTS: /config/known_hosts
  volumes:
    - data:/data
    - backups:/backups
    - ./images:/images:z
    - ./config:/config:ro,z
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  api:
    <<: *service
    ports:
      - "${F5_BIND_ADDRESS:-127.0.0.1}:${F5_PORT:-8080}:8080"
    command: ["f5-upgrade", "serve", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *service
    command: ["f5-upgrade", "worker"]
    stop_grace_period: 2h
volumes:
  data:
  backups:
