# Include INSIDE the existing HTTPS VirtualHost that serves your server IP.
# Requires mod_alias, mod_proxy and mod_proxy_http (plus existing mod_ssl).
# Put these ProxyPass rules before any catch-all ProxyPass "/" rule.
# The application must be reachable from Apache at 127.0.0.1:8091.

# Let mod_alias handle the bare path even if Checkmk has a catch-all proxy.
ProxyPassMatch "^/path-monitor$" "!"
RedirectMatch 308 "^/path-monitor$" "/path-monitor/"

ProxyPass        "/path-monitor/" "http://127.0.0.1:8091/" connectiontimeout=5 timeout=30
ProxyPassReverse "/path-monitor/" "http://127.0.0.1:8091/"

<Location "/path-monitor/">
    # Login checks the external Origin against Host, including its port.
    ProxyPreserveHost On
    # Keep the app's login errors and API 401 responses intact.
    ProxyErrorOverride Off
</Location>

# Keep PATH_MONITOR_COOKIE_SECURE=true in the application's .env.
# Do not rewrite cookie paths: the secure __Host- cookies require Path=/.
# Leave existing Checkmk routes and authentication directives in place.
