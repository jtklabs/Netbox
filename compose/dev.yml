# Dev overlay: local build with plugins, local superuser.
# Selected via COMPOSE_FILE in .env — paths here are relative to the repo root
# (the directory of the base docker-compose.yml).
services:
  netbox:
    image: netbox-custom:v4.6.5-5.0.2
    build:
      context: .
      dockerfile: Dockerfile-Plugins
    pull_policy: never
    depends_on:
      - postgres
    ports:
      # BIND_ADDRESS defaults to loopback. Set it in .env to a LAN address (or
      # 0.0.0.0) when the dev host is a server you reach from elsewhere.
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      # Dev-only local superuser. Password comes from .env, which
      # scripts/init-dev-env.sh generates.
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?run scripts/init-dev-env.sh first}
      # Required once NetBox is reached by any name other than localhost —
      # without it Django rejects the login POST as a CSRF failure.
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  netbox-worker:
    image: netbox-custom:v4.6.5-5.0.2
    pull_policy: never

  # Local database is dev-only; prod points DB_* at RDS (compose/prod.yml).
  # Pinned to the RDS engine major (16.13 in prod) for dev/prod parity.
  postgres:
    image: docker.io/postgres:16-alpine
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    env_file: env/postgres.env
    volumes:
      - netbox-postgres:/var/lib/postgresql

volumes:
  netbox-postgres:
    driver: local
