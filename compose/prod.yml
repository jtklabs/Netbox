# Production overlay (Ubuntu 24 EC2, behind the host Apache at
# netbox.example.com/netbox). Chain: docker-compose.yml:compose/prod.yml
#
# - DB is RDS: no postgres service here (it lives in compose/dev.yml only);
#   DB_* / DB_SSLMODE come from env/prod.env.
# - Media is S3 via S3_MEDIA_BUCKET (configuration/extra.py) + instance role.
# - Apache + Mellon run on a SEPARATE existing server which proxies here over
#   the private network, so the published port is not loopback. Set BIND_ADDRESS
#   in the data-disk .env (NOT env/prod.env — compose cannot see env_file values
#   when substituting ${...}). See apache/netbox.conf.
# - PROD_IMAGE: normally unset. The image is baked into the AMI by
#   scripts/prod-build.sh; bootstrap builds locally as a fallback.
services:
  netbox:
    image: ${PROD_IMAGE:-netbox-custom:v4.6.7-5.0.2}
    build:
      context: .
      dockerfile: Dockerfile-Plugins
    pull_policy: ${PROD_PULL_POLICY:-never}
    restart: unless-stopped
    ports:
      # Apache runs on a SEPARATE server, so this cannot be loopback. Set
      # BIND_ADDRESS=0.0.0.0 in the data-disk .env — not a private IP, which
      # changes with every redeploy while that file persists. Restrict port
      # 8080 to the Apache server with a security group: this hop is plain HTTP
      # and NetBox trusts the identity headers Apache sets, so anything able to
      # reach it directly could impersonate any user.
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    env_file:
      - env/prod.env
    healthcheck:
      # BASE_PATH=netbox/ moves the login URL.
      test: curl -f http://localhost:8080/netbox/login/ || exit 1
      # First boot runs every migration against RDS. Without generous retries the
      # container is marked unhealthy, netbox-worker's depends_on fails, and
      # `docker compose up -d` exits non-zero — aborting bootstrap before its own
      # health gate ever runs.
      start_period: 600s
      timeout: 5s
      interval: 15s
      retries: 40

  netbox-worker:
    image: ${PROD_IMAGE:-netbox-custom:v4.6.7-5.0.2}
    pull_policy: ${PROD_PULL_POLICY:-never}
    restart: unless-stopped
    env_file:
      - env/prod.env

  redis:
    restart: unless-stopped
  redis-cache:
    restart: unless-stopped
