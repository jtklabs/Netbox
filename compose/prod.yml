# Production overlay (Ubuntu 24 EC2, behind the host Apache at
# nova.jtklabs.dev/netbox). Chain: docker-compose.yml:compose/prod.yml
# (+ compose/discovery.yml if the agent runs on this host).
#
# - DB is RDS: no postgres service here (it lives in compose/dev.yml only);
#   DB_* / DB_SSLMODE come from env/prod.env.
# - Media is S3 via S3_MEDIA_BUCKET (configuration/extra.py) + instance role.
# - Apache + Mellon run on a SEPARATE existing server which proxies here over
#   the private network, so the published port is not loopback — see
#   BIND_ADDRESS in env/prod.env and apache/netbox.conf.
# - PROD_IMAGE: normally unset. The image is baked into the AMI by
#   scripts/prod-build.sh; bootstrap builds locally as a fallback.
services:
  netbox:
    image: ${PROD_IMAGE:-netbox-custom:v4.6.5-5.0.2}
    build:
      context: .
      dockerfile: Dockerfile-Plugins
    pull_policy: ${PROD_PULL_POLICY:-never}
    restart: unless-stopped
    ports:
      # Apache runs on a SEPARATE server, so this cannot be loopback. Set
      # BIND_ADDRESS in env/prod.env to the instance's private address, and
      # restrict port 8080 to the Apache server with a security group — this
      # hop is plain HTTP and NetBox trusts the identity headers Apache sets,
      # so reaching it directly means being able to impersonate any user.
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    env_file:
      - env/prod.env
    healthcheck:
      # BASE_PATH=netbox/ moves the login URL.
      test: curl -f http://localhost:8080/netbox/login/ || exit 1
      start_period: 300s
      timeout: 3s
      interval: 15s

  netbox-worker:
    image: ${PROD_IMAGE:-netbox-custom:v4.6.5-5.0.2}
    pull_policy: ${PROD_PULL_POLICY:-never}
    restart: unless-stopped
    env_file:
      - env/prod.env

  redis:
    restart: unless-stopped
  redis-cache:
    restart: unless-stopped
