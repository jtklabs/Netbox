# Dev-only rehearsal of the prod topology: NetBox served at /netbox behind a
# proxy that maps static files and injects the SSO header, exactly like the
# prod Apache/mod_auth_mellon setup. Enable by appending this file to
# COMPOSE_FILE in .env, then `docker compose up -d --force-recreate netbox netbox-worker rehearsal-proxy`.
# Browse http://127.0.0.1:8081/netbox/ — you arrive logged in as REHEARSAL_SSO_USER.
services:
  netbox:
    env_file:
      - env/rehearsal.env
    healthcheck:
      # BASE_PATH moves the login URL; the stock healthcheck would 404.
      test: curl -f http://localhost:8080/netbox/login/ || exit 1

  rehearsal-proxy:
    image: nginx:1.27-alpine
    environment:
      REHEARSAL_SSO_USER: ${REHEARSAL_SSO_USER:-jason}
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./compose/rehearsal-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - netbox
