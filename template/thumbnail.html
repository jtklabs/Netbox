<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 156px;overflow:hidden;background:var(--navy-700)}.mark{display:flex;align-items:center;justify-content:center;background:var(--navy-700)}.mark span{font-family:var(--font-sans);font-weight:700;font-size:170px;line-height:1;letter-spacing:-0.03em;color:#fff}.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip i{display:block}</style>
</head>
<body>
<div class="mark"><span>Nova</span></div>
<div class="strip"><i style="background:#CC4A51"></i><i style="background:#8A5A00"></i><i style="background:#1B5E8C"></i><i style="background:#B4232B"></i></div>
</body>
</html>
