<!-- @dsCard group="Brand" viewport="700x140" name="Corner radii" subtitle="4px is the house radius; pills only for status" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-card);padding:16px;font-size:var(--text-base)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;min-width:0}.sw b{font-size:10px;font-weight:600;letter-spacing:.04em;display:block}.sw span{font-family:var(--font-mono);font-size:9px;opacity:.8;display:block}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lb{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style>
</head>
<body>
<div style="display:flex;gap:14px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:84px;height:56px;background:var(--navy-50);border:1px solid var(--navy-200);border-radius:2px"></div><span class="tok">--radius-sm</span><span style="font-size:10px;color:var(--text-subtle)">2px · checkbox, badge</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:84px;height:56px;background:var(--navy-50);border:1px solid var(--navy-200);border-radius:4px"></div><span class="tok">--radius-md</span><span style="font-size:10px;color:var(--text-subtle)">4px · buttons, inputs</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:84px;height:56px;background:var(--navy-50);border:1px solid var(--navy-200);border-radius:6px"></div><span class="tok">--radius-lg</span><span style="font-size:10px;color:var(--text-subtle)">6px · cards, dialogs</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:84px;height:56px;background:var(--navy-50);border:1px solid var(--navy-200);border-radius:8px"></div><span class="tok">--radius-xl</span><span style="font-size:10px;color:var(--text-subtle)">8px · nothing yet</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:84px;height:56px;background:var(--navy-50);border:1px solid var(--navy-200);border-radius:999px"></div><span class="tok">--radius-pill</span><span style="font-size:10px;color:var(--text-subtle)">999px · status pills</span></div></div>
</body>
</html>
