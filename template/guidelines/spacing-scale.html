<!DOCTYPE html>

<head>

<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-card);padding:16px;font-size:var(--text-base)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;min-width:0}.sw b{font-size:10px;font-weight:600;letter-spacing:.04em;display:block}.sw span{font-family:var(--font-mono);font-size:9px;opacity:.8;display:block}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lb{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style>
</head>

 style="display:flex;align-items:center;gap:10px"><span class="tok" style="width:86px;flex:0 0 auto">--space-6</span><span class="tok" style="width:34px;flex:0 0 auto">24px</span><span style="height:10px;width:24px;background:var(--navy-300);border-radius:1px"></span></div><div style="display:flex;align-items:center;gap:10px"><span class="tok" style="width:86px;flex:0 0 auto">--space-8</span><span class="tok" style="width:34px;flex:0 0 auto">32px</span><span style="height:10px;width:32px;background:var(--navy-300);border-radius:1px"></span></div><div style="display:flex;align-items:center;gap:10px"><span class="tok" style="width:86px;flex:0 0 auto">--space-10</span><span class="tok" style="width:34px;flex:0 0 auto">40px</span><span style="height:10px;width:40px;background:var(--navy-300);border-radius:1px"></span></div><div style="display:flex;align-items:center;gap:10px"><span class="tok" style="width:86px;flex:0 0 auto">--space-12</span><span class="tok" style="width:34px;flex:0 0 auto">48px</span><span style="height:10px;width:48px;background:var(--navy-300);border-radius:1px"></span></div><div style="display:flex;align-items:center;gap:10px"><span class="tok" style="width:86px;flex:0 0 auto">--space-16</span><span class="tok" style="width:34px;flex:0 0 auto">64px</span><span style="height:10px;width:64px;background:var(--navy-300);border-radius:1px"></span></div></div>
