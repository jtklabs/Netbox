<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Three stops each: ink, tint, edge" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-card);padding:16px;font-size:var(--text-base)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;min-width:0}.sw b{font-size:10px;font-weight:600;letter-spacing:.04em;display:block}.sw span{font-family:var(--font-mono);font-size:9px;opacity:.8;display:block}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lb{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"><div><div style="height:54px;border:1px solid var(--success-edge);border-radius:var(--radius-md);background:var(--success-tint);display:flex;align-items:center;justify-content:center;gap:5px;color:var(--success-ink);font-size:var(--text-xs);font-weight:500"><span style="width:7px;height:7px;border-radius:99px;background:var(--success-ink)"></span>Success</div>
<div class="tok" style="margin-top:5px;line-height:1.5">--success-ink<br>--success-tint<br>--success-edge</div></div><div><div style="height:54px;border:1px solid var(--warning-edge);border-radius:var(--radius-md);background:var(--warning-tint);display:flex;align-items:center;justify-content:center;gap:5px;color:var(--warning-ink);font-size:var(--text-xs);font-weight:500"><span style="width:7px;height:7px;border-radius:99px;background:var(--warning-ink)"></span>Warning</div>
<div class="tok" style="margin-top:5px;line-height:1.5">--warning-ink<br>--warning-tint<br>--warning-edge</div></div><div><div style="height:54px;border:1px solid var(--danger-edge);border-radius:var(--radius-md);background:var(--danger-tint);display:flex;align-items:center;justify-content:center;gap:5px;color:var(--danger-ink);font-size:var(--text-xs);font-weight:500"><span style="width:7px;height:7px;border-radius:99px;background:var(--danger-ink)"></span>Danger</div>
<div class="tok" style="margin-top:5px;line-height:1.5">--danger-ink<br>--danger-tint<br>--danger-edge</div></div><div><div style="height:54px;border:1px solid var(--info-edge);border-radius:var(--radius-md);background:var(--info-tint);display:flex;align-items:center;justify-content:center;gap:5px;color:var(--info-ink);font-size:var(--text-xs);font-weight:500"><span style="width:7px;height:7px;border-radius:99px;background:var(--info-ink)"></span>Info</div>
<div class="tok" style="margin-top:5px;line-height:1.5">--info-ink<br>--info-tint<br>--info-edge</div></div><div><div style="height:54px;border:1px solid var(--neutral-edge);border-radius:var(--radius-md);background:var(--neutral-tint);display:flex;align-items:center;justify-content:center;gap:5px;color:var(--neutral-ink);font-size:var(--text-xs);font-weight:500"><span style="width:7px;height:7px;border-radius:99px;background:var(--neutral-ink)"></span>Neutral</div>
<div class="tok" style="margin-top:5px;line-height:1.5">--neutral-ink<br>--neutral-tint<br>--neutral-edge</div></div></div>
</body>
</html>
