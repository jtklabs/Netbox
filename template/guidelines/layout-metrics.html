<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-card);padding:16px;font-size:var(--text-base)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;min-width:0}.sw b{font-size:10px;font-weight:600;letter-spacing:.04em;display:block}.sw span{font-family:var(--font-mono);font-size:9px;opacity:.8;display:block}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lb{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style>
</head>
<body>
<div style="display:flex;gap:0;height:96px;border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden">
<div style="width:118px;background:var(--surface-nav);color:#fff;font-size:10px;font-family:var(--font-mono);padding:8px;flex:0 0 auto">--nav-width<br>236px</div>
<div style="flex:1;display:flex;flex-direction:column">
<div style="height:34px;background:var(--surface-header);border-bottom:1px solid var(--border-default);font-family:var(--font-mono);font-size:10px;padding:0 10px;display:flex;align-items:center;color:var(--text-muted)">--header-height 56px</div>
<div style="flex:1;background:var(--surface-page);font-family:var(--font-mono);font-size:10px;padding:8px 10px;color:var(--text-muted)">--page-gutter 24px · --content-max 1440px (prose only)</div>
</div></div>
<div style="display:flex;gap:16px;margin-top:10px;align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><span style="height:28px;min-width:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);color:var(--text-muted)">28px</span><span class="tok">--control-height-sm</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><span style="height:34px;min-width:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);color:var(--text-muted)">34px</span><span class="tok">--control-height</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><span style="height:40px;min-width:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);color:var(--text-muted)">40px</span><span class="tok">--control-height-lg</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><span style="height:40px;min-width:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);color:var(--text-muted)">40px</span><span class="tok">--row-height</span></div>
</div>
</body>
</html>
