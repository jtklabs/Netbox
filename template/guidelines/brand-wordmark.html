<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark" subtitle="No logo file was supplied — the name is set in type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-card);padding:16px;font-size:var(--text-base)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;min-width:0}.sw b{font-size:10px;font-weight:600;letter-spacing:.04em;display:block}.sw span{font-family:var(--font-mono);font-size:9px;opacity:.8;display:block}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lb{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style>
</head>
<body>
<div style="display:flex;gap:16px;align-items:stretch">
<div style="flex:1;background:var(--surface-nav);border-radius:var(--radius-card);padding:16px;display:flex;align-items:center"><span style="font-size:32px;font-weight:700;letter-spacing:-0.03em;color:#fff">Nova</span></div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:16px;display:flex;align-items:center"><span style="font-size:32px;font-weight:700;letter-spacing:-0.03em;color:var(--navy-700)">Nova</span></div>
<div style="flex:0 0 96px;background:var(--navy-700);border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center"><span style="font-size:32px;font-weight:700;color:#fff">N</span></div>
</div>
<div class="tok" style="margin-top:8px">Public Sans 700, -0.03em tracking. White on --surface-nav, --navy-700 on light. Single letter only in the 56px collapsed rail. Replace with an SVG in assets/ when one exists.</div>
</body>
</html>
