<!-- @dsCard group="Brand" viewport="700x160" name="Elevation" subtitle="Flat by default — shadows mark things that float" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-card);padding:16px;font-size:var(--text-base)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;min-width:0}.sw b{font-size:10px;font-weight:600;letter-spacing:.04em;display:block}.sw span{font-family:var(--font-mono);font-size:9px;opacity:.8;display:block}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lb{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style>
</head>
<body>
<div style="background:var(--surface-page);padding:18px;border-radius:var(--radius-md);display:flex;gap:16px;align-items:center"><div style="flex:1;min-width:0"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-card)"></div><div class="tok" style="margin-top:7px">--shadow-card</div><div style="font-size:10px;color:var(--text-subtle)">cards (1px border instead)</div></div><div style="flex:1;min-width:0"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></div><div class="tok" style="margin-top:7px">--shadow-sm</div><div style="font-size:10px;color:var(--text-subtle)">hover lift, rarely</div></div><div style="flex:1;min-width:0"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-dropdown)"></div><div class="tok" style="margin-top:7px">--shadow-dropdown</div><div style="font-size:10px;color:var(--text-subtle)">menus, popovers</div></div><div style="flex:1;min-width:0"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-dialog)"></div><div class="tok" style="margin-top:7px">--shadow-dialog</div><div style="font-size:10px;color:var(--text-subtle)">modals</div></div></div>
</body>
</html>
