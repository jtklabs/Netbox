<!-- @dsCard group="Colors" viewport="700x160" name="Dark theme" subtitle="Same aliases, re-pointed under [data-theme='dark']" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-card);padding:16px;font-size:var(--text-base)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;min-width:0}.sw b{font-size:10px;font-weight:600;letter-spacing:.04em;display:block}.sw span{font-family:var(--font-mono);font-size:9px;opacity:.8;display:block}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lb{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);font-weight:600}</style>
</head>
<body>
<div data-theme="dark" style="background:var(--surface-page);padding:14px;border-radius:var(--radius-card);display:flex;gap:12px;align-items:stretch">
<div style="width:120px;background:var(--surface-nav);border-radius:var(--radius-md);padding:10px;color:#fff;font-weight:700;font-size:var(--text-md)">Nova</div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:12px;display:flex;flex-direction:column;gap:8px">
<div style="color:var(--text-heading);font-weight:600">Circuit CKT-40182</div>
<div style="color:var(--text-muted);font-size:var(--text-sm)">Lumen · CHI-01 · 1 Gbps</div>
<div style="display:flex;gap:8px;align-items:center">
<span style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px 0 7px;border-radius:99px;background:var(--success-tint);border:1px solid var(--success-edge);color:var(--success-ink);font-size:var(--text-xs)"><span style="width:6px;height:6px;border-radius:99px;background:var(--success-ink)"></span>Active</span>
<span style="height:34px;display:inline-flex;align-items:center;padding:0 12px;border-radius:4px;background:var(--action-primary-bg);color:#fff;font-size:var(--text-base);font-weight:500">Edit</span>
<span style="height:34px;display:inline-flex;align-items:center;padding:0 12px;border-radius:4px;background:var(--action-secondary-bg);border:1px solid var(--border-default);color:var(--action-secondary-fg);font-size:var(--text-base);font-weight:500">Cancel</span>
</div></div></div>
<div class="tok" style="margin-top:8px">Set data-theme="dark" on &lt;html&gt;. Ramps are unchanged — only aliases move, so components need no dark-specific code.</div>
</body>
</html>
