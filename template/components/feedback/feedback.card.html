<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-card);padding:16px}.lbl{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);font-weight:600;margin-bottom:6px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cols{display:flex;gap:24px;align-items:flex-start}.grp{display:flex;flex-direction:column;gap:14px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Alert, Dialog, Toast, Tooltip, Button, IconButton, FormField, Select } = window.PortalDesignSystem_986bf0;
function Demo(){
  return (
    <div className="grp">
      <Alert tone="danger" title="3 fields need attention">Correct the highlighted fields and submit the report again.</Alert>
      <Alert tone="warning" title="Q3 access review closes 30 Sep" action={<Button variant="link" size="sm">Open review</Button>}/>
      <Alert tone="success" title="Report accepted" onDismiss={()=>{}}>Submitted to the audit queue as REP-2291.</Alert>
      <Alert tone="info" title="Scheduled maintenance 20 Sep, 02:00–04:00 UTC" onDismiss={()=>{}}/>
      <div className="cols" style={{gap:16}}>
        <div style={{flex:'0 0 340px'}}>
          <div className="lbl">Toast</div>
          <Toast tone="success" title="Task reassigned" onDismiss={()=>{}} action={<Button variant="link" size="sm">Undo</Button>}>Now assigned to D. Okafor.</Toast>
        </div>
        <div>
          <div className="lbl">Tooltip (hover)</div>
          <div className="row">
            <Tooltip label="Last polled 4 minutes ago"><IconButton icon="clock" label="Poll status"/></Tooltip>
            <Tooltip label="Export current view as CSV" placement="right"><IconButton icon="download" label="Export" variant="secondary"/></Tooltip>
          </div>
        </div>
      </div>
      <div>
        <div className="lbl">Dialog</div>
        <div style={{position:'relative',height:200,border:'1px solid var(--border-default)',borderRadius:'var(--radius-card)',background:'var(--surface-page)',overflow:'hidden'}}>
          <Dialog open title="Reassign 4 tasks" description="Assignees are notified by email." width={420}
            footer={<><Button>Cancel</Button><Button variant="primary">Reassign</Button></>}>
            <FormField label="Assign to" htmlFor="as"><Select id="as" options={["D. Okafor","M. Ruiz","J. Lindqvist"]}/></FormField>
          </Dialog>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
