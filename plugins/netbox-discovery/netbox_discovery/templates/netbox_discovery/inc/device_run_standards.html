<div class="card">
  <h5 class="card-header">Run standards now</h5>
  <div class="card-body">
    {% if run_choices %}
    <form method="post" action="{% url 'plugins:netbox_discovery:device_run_standards' pk=object.pk %}">
      {% csrf_token %}
      <label class="form-label" for="run-standard-selection">Standard or profile</label>
      <select class="form-select mb-2" id="run-standard-selection" name="selection">
        {% for choice in run_choices %}<option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}>{{ choice.label }}</option>{% endfor %}
      </select>
      <label class="form-label" for="run-standard-action">Action</label>
      <select class="form-select mb-2" id="run-standard-action" name="action">
        {% if can_apply_standards %}<option value="auto">Use standard / profile settings</option>{% endif %}
        <option value="audit">Audit only</option>
        {% if can_apply_standards %}
        <option value="add">Add missing</option>
        <option value="replace">Add and remove</option>
        {% endif %}
      </select>
      <button class="btn btn-primary" type="submit"><i class="mdi mdi-play" aria-hidden="true"></i> Run now</button>
      <p class="text-muted small mt-2 mb-0">Queues this device immediately using its current standards and assigned worker. Opens the run to show progress and errors.</p>
    </form>
    {% else %}<p class="text-muted mb-0">{{ run_error|default:'No accessible standards or profiles are available for this device.' }}</p>{% endif %}
  </div>
</div>
