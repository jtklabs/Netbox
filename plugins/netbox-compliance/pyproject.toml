[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-compliance"
version = "0.1.0"
description = "Device configuration standards, per-device compliance and remediation planning for NetBox"
authors = [{ name = "Nova Team" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["netbox_compliance*"]

[tool.setuptools.package-data]
netbox_compliance = ["templates/**/*.html"]
