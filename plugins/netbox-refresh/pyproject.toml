[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-refresh"
version = "0.4.1"
description = "Hardware and software lifecycle, licenses, and support coverage for NetBox"
authors = [{ name = "Nova Team" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["netbox_refresh*"]

[tool.setuptools.package-data]
netbox_refresh = ["templates/**/*.html", "static/**/*.js"]
