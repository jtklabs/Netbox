[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-refresh"
version = "0.1.0"
description = "Hardware end-of-life tracking, replacement planning and refresh cost reporting for NetBox"
authors = [{ name = "JTK Labs", email = "jason@jtklabs.dev" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["netbox_refresh*"]

[tool.setuptools.package-data]
netbox_refresh = ["templates/**/*.html"]
