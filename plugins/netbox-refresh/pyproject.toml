[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-refresh"
version = "0.2.0"
description = "Hardware end-of-life tracking and software image compliance for NetBox"
authors = [{ name = "Nova Team" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["netbox_refresh*"]

[tool.setuptools.package-data]
netbox_refresh = ["templates/**/*.html"]
