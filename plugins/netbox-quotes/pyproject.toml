[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-quotes"
version = "0.1.0"
description = "Vendor support-renewal quotes with serial-matched device assignment for NetBox"
authors = [{ name = "JTK Labs", email = "jason@jtklabs.dev" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["netbox_quotes*"]

[tool.setuptools.package-data]
netbox_quotes = ["templates/**/*.html"]
