# Remote collector: one orb-agent, pushing to the central Diode over gRPC.
#
# Deliberately self-contained — this is the ONLY file a remote box needs from
# the repo besides its own collector.env and policies.yaml. Nothing here talks
# to PostgreSQL or Redis; the only outbound dependency is the Diode endpoint.
services:
  orb-agent:
    image: netboxlabs/orb-agent:${ORB_AGENT_TAG:-2.11.0}
    container_name: orb-collector
    restart: unless-stopped
    # Host networking so scans and SSH/SNMP reach the local network directly,
    # and so nmap-based discovery has the raw-socket access it needs.
    network_mode: host
    environment:
      DIODE_CLIENT_ID: ${DIODE_CLIENT_ID:?set in collector.env}
      DIODE_CLIENT_SECRET: ${DIODE_CLIENT_SECRET:?set in collector.env}
      COLLECTOR_NAME: ${COLLECTOR_NAME:?set in collector.env}
      DIODE_TARGET: ${DIODE_TARGET:?set in collector.env}
      # Device credentials referenced by policies.yaml
      SNMP_USER: ${SNMP_USER:-}
      SNMP_AUTH_PASS: ${SNMP_AUTH_PASS:-}
      SNMP_PRIV_PASS: ${SNMP_PRIV_PASS:-}
      DEVICE_USER: ${DEVICE_USER:-}
      DEVICE_PASS: ${DEVICE_PASS:-}
      # Private CA for the Diode endpoint, if you use one (mount it in below).
      DIODE_CERT_FILE: ${DIODE_CERT_FILE:-}
      # Custom worker packages, if this collector runs any (see worker-example/).
      INSTALL_WORKERS_PATH: ${INSTALL_WORKERS_PATH:-}
      # NOT under /opt/orb: that path is the bundle, bind-mounted read-only
      # just below. Docker must create a mountpoint for this volume, and it
      # cannot mkdir inside a read-only mount — the container then fails every
      # start with `mkdir .../merged/opt/orb/pip-cache: read-only file system`.
      PIP_CACHE_DIR: /opt/pip-cache
    volumes:
      - ./:/opt/orb/:ro
      - orb-pip-cache:/opt/pip-cache
    command: run -c /opt/orb/agent.yaml

volumes:
  orb-pip-cache:
