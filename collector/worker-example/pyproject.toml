[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "example-collector"
version = "0.1.0"
description = "Example custom collector running inside orb-agent on a remote box"
requires-python = ">=3.10"
dependencies = [
    # Provides the Backend base class and the Diode entity models.
    "netboxlabs-orb-worker>=1.16.0",
]

[tool.setuptools.packages.find]
include = ["example_collector*"]
