# NetBox reverse-proxy + SAML SSO include for the existing Apache vhost on
# nova.jtklabs.dev. Drop into the vhost (inside the <VirtualHost *:443> that
# already serves Nova) and adjust the three MELLON file paths + the IdP
# metadata. Requires: mod_proxy, mod_proxy_http, mod_headers, mod_auth_mellon.
#
# Generate SP cert/key once (stored on the data disk so they survive AMI
# redeploys):  mellon_create_metadata.sh https://nova.jtklabs.dev/mellon \
#              "https://nova.jtklabs.dev/mellon"

<Location /mellon>
    SetHandler none
    MellonEnable info
    MellonEndpointPath /mellon
    MellonSPPrivateKeyFile /data/netbox-secrets/saml/mellon.key
    MellonSPCertFile       /data/netbox-secrets/saml/mellon.cert
    MellonIdPMetadataFile  /data/netbox-secrets/saml/idp-metadata.xml
</Location>

<Location /netbox>
    MellonEnable auth
    AuthType Mellon
    Require valid-user
</Location>

# --- Spoof-proof identity header -------------------------------------------
# Strip any client-supplied header, then set it from the SAML session.
# MELLON_uid assumes the IdP releases a "uid" attribute; if the username lives
# in a different attribute (e.g. NameID or mail), change the env var name —
# mellon exports each attribute as MELLON_<attr>.
RequestHeader unset X-Remote-User
<Location /netbox>
    RequestHeader set X-Remote-User "%{MELLON_uid}e" env=MELLON_uid
</Location>

# --- Proxy to the NetBox container (loopback) --------------------------------
# ORDER MATTERS: the static mapping must precede the app route, because the
# container's Granian server serves /static (unprefixed) while BASE_PATH pages
# reference /netbox/static/. Do NOT strip /netbox on app routes — Django
# expects the prefix when BASE_PATH is set.
ProxyPreserveHost On
ProxyPass        /netbox/static/ http://127.0.0.1:8080/static/
ProxyPassReverse /netbox/static/ http://127.0.0.1:8080/static/
ProxyPass        /netbox/ http://127.0.0.1:8080/netbox/
ProxyPassReverse /netbox/ http://127.0.0.1:8080/netbox/
RequestHeader set X-Forwarded-Proto "https"

# --- Logout note -------------------------------------------------------------
# NetBox's logout only ends the Django session; the mellon SAML session keeps
# re-authenticating. For a full logout point users at:
#   https://nova.jtklabs.dev/mellon/logout?ReturnTo=https://nova.jtklabs.dev/
