# NetBox reverse-proxy include for the EXISTING Apache server that already runs
# mod_auth_mellon and serves netbox.example.com.
#
# Apache and NetBox are on different hosts: this config proxies across the
# network to the NetBox instance. Nothing here configures Mellon itself — the SP
# keys, IdP metadata and endpoint already exist on that server and are untouched.
#
# INSTALL
#   1. Set NETBOX_BACKEND below to the NetBox instance's address.
#   2. Copy this file to the Apache server, e.g.
#        /etc/apache2/conf-available/netbox.conf
#   3. Include it INSIDE the existing <VirtualHost *:443> for netbox.example.com:
#        Include conf-available/netbox.conf
#   4. sudo a2enmod proxy proxy_http headers    (mellon is already enabled)
#      sudo apachectl configtest && sudo systemctl reload apache2
#
# PREREQUISITES ON THE NETBOX SIDE
#   * NetBox must be reachable from this server on port 8080. Set
#     BIND_ADDRESS=0.0.0.0 in the data-disk `.env` — NOT in prod.env, where
#     Compose cannot see it, and not a private IP, which changes each redeploy.
#   * Lock that port down with a security group allowing ONLY this Apache
#     server. The backend hop is plain HTTP and NetBox trusts the identity
#     headers set below, so anything able to reach 8080 directly could
#     impersonate any user. The security group is the control that prevents it.

# The NetBox instance, as reachable from THIS server. Must not be public.
#
# Prefer a STABLE address, because the instance is replaced every 30 days and a
# raw private IP would have to be edited here after each redeploy — which
# defeats the "zero manual steps" redeploy. Two ways to get one:
#   * attach a dedicated ENI with a fixed private IP and move it to the new
#     instance alongside the data disk, or
#   * point an internal DNS record at the new instance during the redeploy.
Define NETBOX_BACKEND http://CHANGE_ME_STABLE_NETBOX_ADDRESS:8080

# --- Require SAML auth for the NetBox path -----------------------------------
# Skip this block if the vhost already applies `MellonEnable auth` globally;
# duplicating it is harmless but redundant.
<Location /netbox>
    MellonEnable auth
    AuthType Mellon
    Require valid-user
</Location>

# --- Spoof protection --------------------------------------------------------
# Strip any identity headers arriving from the CLIENT before Mellon's own rules
# populate them. "early" runs this before other header processing, so a request
# cannot smuggle in its own X-Remote-User. Keep this even though the backend is
# firewalled — defence in depth, and it costs nothing.
RequestHeader unset X-Remote-User early
RequestHeader unset X-User-AD-Username early
RequestHeader unset X-User-Email early
RequestHeader unset X-UserFirstName early
RequestHeader unset X-User-LastName early
RequestHeader unset X-User-FullName early
RequestHeader unset X-User-Groups early

# --- Mellon attributes → identity headers (REQUIRED — fill in and uncomment) --
# mod_auth_mellon does NOT set request headers. It exports each SAML attribute
# as an Apache ENVIRONMENT variable (MELLON_<attr>), which an app running on
# this server could read — but NetBox is on another host behind mod_proxy, and
# env vars never cross a proxy hop. Unless something maps them into headers,
# NetBox receives a fully authenticated request with no identity on it at all:
# Mellon prompts, NetBox stays anonymous, and no account is ever created.
#
# If this vhost already builds the X-User-*/X-Remote-User headers for another
# application, check the SCOPE of those RequestHeader lines: inside that app's
# <Location> they do not apply to /netbox. Move them to vhost scope or
# replicate them here.
#
# The MELLON_* names below are the ones this deployment's IdP actually sends
# (confirmed from the existing application's mappings). If yours differ, find
# them with:
#   grep -ri "MellonSetEnv\|MELLON_" /etc/apache2/
# or enable "MellonDiagnosticsFile /var/log/apache2/mellon.log" +
# "MellonDiagnosticsEnable On" for one login and read what the IdP sent.
#
# Notes that save an afternoon:
#   * Do NOT add "early" to these lines. "early" runs before authentication,
#     when the MELLON_* vars do not exist yet. (The unset lines above are
#     "early" precisely so they run first; normal-phase sets win afterward.)
#   * The env= guard means "only set the header if that env var exists" —
#     without it, a typoed attribute name writes the literal string "(null)"
#     into the header, and NetBox happily creates a user named "(null)".
#   * Multi-valued attributes (memberOf!) export as MELLON_memberOf_0,
#     MELLON_memberOf_1, ... — the bare MELLON_memberOf holds only the FIRST
#     value until MellonMergeEnvVars collapses them into one. Landing with
#     exactly one group when you expect several means this line is missing.
#     "|" matches REMOTE_AUTH_GROUP_SEPARATOR in env/prod.env.example.
#   * Header spelling: NetBox reads X-UserFirstName (HTTP_X_USERFIRSTNAME) —
#     no dash between User and FirstName. An existing app's X-User-FirstName
#     mapping is a DIFFERENT header that NetBox never sees.
#   * memberOf may arrive as plain names or full DNs depending on the IdP
#     claim config. Group sync creates exactly the strings it receives, and
#     REMOTE_AUTH_SUPERUSER_GROUPS matches exact strings — check what your
#     first login actually lands with.
#
# <Location /netbox>
#     MellonMergeEnvVars On "|"
#     RequestHeader set X-Remote-User   "%{MELLON_username}e"  env=MELLON_username
#     RequestHeader set X-User-Email    "%{MELLON_email}e"     env=MELLON_email
#     RequestHeader set X-UserFirstName "%{MELLON_firstName}e" env=MELLON_firstName
#     RequestHeader set X-User-LastName "%{MELLON_lastName}e"  env=MELLON_lastName
#     RequestHeader set X-User-Groups   "%{MELLON_memberOf}e"  env=MELLON_memberOf
# </Location>

# --- Proxy to the NetBox instance --------------------------------------------
# ORDER MATTERS: the static mapping must come first. NetBox is configured with
# BASE_PATH=netbox/ so its pages reference /netbox/static/..., but the container
# serves static files at /static/ — this maps them back. App routes keep the
# /netbox prefix, because Django expects it when BASE_PATH is set.
# /netbox with no trailing slash would miss the ProxyPass below and fall
# through to the vhost default.
RedirectMatch 302 ^/netbox$ /netbox/

ProxyPreserveHost On
ProxyPass        /netbox/static/ ${NETBOX_BACKEND}/static/
ProxyPassReverse /netbox/static/ ${NETBOX_BACKEND}/static/
ProxyPass        /netbox/ ${NETBOX_BACKEND}/netbox/
ProxyPassReverse /netbox/ ${NETBOX_BACKEND}/netbox/

# TLS terminates here, so tell Django the original scheme or it will build
# http:// URLs and reject form posts as CSRF failures.
RequestHeader set X-Forwarded-Proto "https"

# Backend is on another host: fail fast rather than hanging a worker if the
# NetBox instance is down or being redeployed.
ProxyTimeout 300
<Proxy ${NETBOX_BACKEND}>
    ProxySet connectiontimeout=5 timeout=300 retry=5
</Proxy>

# --- Logout ------------------------------------------------------------------
# NetBox's own logout only ends the Django session; the Mellon SAML session
# would immediately re-authenticate. Point users at the existing Mellon endpoint
# for a real logout, e.g.:
#   https://netbox.example.com/mellon/logout?ReturnTo=https://netbox.example.com/
