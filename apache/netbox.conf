# NetBox reverse-proxy include for the existing Apache vhost on
# nova.jtklabs.dev, which ALREADY runs mod_auth_mellon and injects the
# identity headers (X-Remote-User, X-User-AD-Username, X-User-Email,
# X-UserFirstName, X-User-LastName, X-User-FullName, X-User-Groups).
# This include therefore only needs to: protect /netbox, strip client-spoofed
# identity headers before Mellon sets the real ones, and proxy correctly.
# Requires: mod_proxy, mod_proxy_http, mod_headers (mellon already loaded).

# --- Require SAML auth for the NetBox path -----------------------------------
# Adjust to match how the existing vhost applies Mellon (skip if the whole
# vhost is already behind `MellonEnable auth`).
<Location /netbox>
    MellonEnable auth
    AuthType Mellon
    Require valid-user
</Location>

# --- Spoof protection --------------------------------------------------------
# Strip inbound identity headers from the CLIENT before the Mellon-driven
# rules set the real ones ("early" runs before other header processing).
RequestHeader unset X-Remote-User early
RequestHeader unset X-User-AD-Username early
RequestHeader unset X-User-Email early
RequestHeader unset X-UserFirstName early
RequestHeader unset X-User-LastName early
RequestHeader unset X-User-FullName early
RequestHeader unset X-User-Groups early

# --- Proxy to the NetBox container (loopback) --------------------------------
# ORDER MATTERS: the static mapping must precede the app route, because the
# container's Granian server serves /static (unprefixed) while BASE_PATH pages
# reference /netbox/static/. Do NOT strip /netbox on app routes — Django
# expects the prefix when BASE_PATH is set.
ProxyPreserveHost On
ProxyPass        /netbox/static/ http://127.0.0.1:8080/static/
ProxyPassReverse /netbox/static/ http://127.0.0.1:8080/static/
ProxyPass        /netbox/ http://127.0.0.1:8080/netbox/
ProxyPassReverse /netbox/ http://127.0.0.1:8080/netbox/
RequestHeader set X-Forwarded-Proto "https"

# --- Logout note -------------------------------------------------------------
# NetBox's logout only ends the Django session; the Mellon SAML session keeps
# re-authenticating. For a full logout point users at the existing Mellon
# endpoint, e.g.:
#   https://nova.jtklabs.dev/mellon/logout?ReturnTo=https://nova.jtklabs.dev/
